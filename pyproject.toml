[build-system]
requires = ["setuptools==68.2.2", "wheel==0.41.2"]
build-backend = "setuptools.build_meta"

[project]
name = "physmel-lv-world"
version = "0.1.0"
description = "Physics constrained melanoma metastasis trajectory modelling"
requires-python = "==3.10.*"
dependencies = [
  "torch==2.1.0",
  "numpy==1.24.4",
  "PyYAML==6.0.1",
  "scikit-learn==1.3.2",
  "pandas==2.0.3",
  "lifelines==0.27.8",
  "torchdiffeq==0.2.3"
]

[project.scripts]
physmel-train = "physmel_lv_world.gateways.train:main"
physmel-eval = "physmel_lv_world.gateways.score:main"
physmel-infer = "physmel_lv_world.gateways.infer:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["bench"]
pythonpath = ["src"]

[tool.ruff]
line-length = 96
src = ["src", "bench"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN"]
ignore = ["ANN101", "ANN102"]

[tool.black]
line-length = 96

[tool.isort]
profile = "black"
